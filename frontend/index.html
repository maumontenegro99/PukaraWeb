<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grupo Guía y Scout Pukara Weche: noticias, biblioteca y panel del grupo." />
    <title>Pukara Weche</title>
    <script>
      // Aplica el tema guardado antes de pintar la página, para evitar un destello claro al cargar en modo oscuro.
      try {
        var tema = localStorage.getItem('tema') || 'sistema';
        var hora = new Date().getHours();
        // 'horario': oscuro de 20:00 a 7:00 (misma regla que src/lib/tema.js).
        var oscuro =
          tema === 'oscuro' ||
          (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
          (tema === 'horario' && (hora >= 20 || hora < 7));
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
