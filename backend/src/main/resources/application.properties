
spring.application.name=PukaraWeb
spring.datasource.url=jdbc:mysql://localhost:3306/pukaraweb_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true


# Credenciales de MySQL: se leen de variables de entorno, nunca se escriben aquí.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Archivos de la biblioteca (manuales, formularios y autorizaciones firmadas)
pukara.archivos.dir=./data/archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.resolve-lazily=true

# Límite de envíos por IP en los formularios públicos (autorizaciones, comprobantes de pago y consulta de pagos)
pukara.limite.envios=5
pukara.limite.consultas=15
pukara.limite.ventana-minutos=10

# Clave para firmar los tokens de sesión (JWT). Al menos 32 caracteres aleatorios; en producción viene de la variable JWT_SECRETO.
# Generar una con: openssl rand -base64 48
pukara.jwt.secreto=${JWT_SECRETO}

# Contraseña del usuario "admin" que se crea en el primer arranque (solo si aún no existe). Si no se define, no se crea.
# Cámbiala desde "Mi perfil" después de entrar.
pukara.admin.clave-inicial=${ADMIN_CLAVE_INICIAL:}
