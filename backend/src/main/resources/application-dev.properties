# Perfil de desarrollo: H2 embebido en archivo (backend/data/), no requiere MySQL.
# Activar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:file:./data/pukaraweb-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Consola web para ver y agregar datos de prueba: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Secretos de desarrollo (nunca usar en producción)
pukara.jwt.secreto=solo-para-desarrollo-no-usar-en-produccion-pukara-weche
pukara.admin.clave-inicial=admin123
