# Perfil de pruebas: H2 en memoria, se crea y se borra en cada ejecución. No necesita MySQL.
spring.datasource.url=jdbc:h2:mem:pukaraweb-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
pukara.archivos.dir=${java.io.tmpdir}/pukaraweb-test-archivos

# Secretos de pruebas (nunca usar en producción)
pukara.jwt.secreto=solo-para-pruebas-no-usar-en-produccion-pukara-weche
pukara.admin.clave-inicial=admin123
